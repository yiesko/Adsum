[package]
name = "adsum-transport-ws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Discord-facing game WebSocket transport over adsum-ws: validation, dispatch, bounded sink"
license.workspace = true
repository.workspace = true
keywords = ["discord", "rich-presence", "rpc", "websocket"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
adsum-types = { path = "../adsum-types" }
adsum-protocol = { path = "../adsum-protocol" }
adsum-ws = { path = "../adsum-ws" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
tokio-tungstenite.workspace = true
tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true
adsum-ws = { path = "../adsum-ws", features = ["test-util"] }
