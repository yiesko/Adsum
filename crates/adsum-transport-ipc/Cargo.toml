[package]
name = "adsum-transport-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Discord IPC transport: framed protocol, Unix socket and Windows pipe servers with JoinSet lifecycle"
license.workspace = true
repository.workspace = true
keywords = ["discord", "rich-presence", "rpc", "ipc"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
adsum-types = { path = "../adsum-types" }
adsum-protocol = { path = "../adsum-protocol" }
adsum-oauth = { path = "../adsum-oauth" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
tokio-util = "0.7"
interprocess = "2.2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# SDDL string for the pipe DACL; already in the tree via interprocess.
widestring = "1.2"

[dev-dependencies]
libc = "0.2"
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
serde_json.workspace = true
