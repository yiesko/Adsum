[package]
name = "adsum-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.adsum-detect]
path = "../crates/adsum-detect"
[dependencies.adsum-types]
path = "../crates/adsum-types"
[dependencies.adsum-protocol]
path = "../crates/adsum-protocol"
[dependencies.adsum-transport-ipc]
path = "../crates/adsum-transport-ipc"

[[bin]]
name = "activity_full"
path = "fuzz_targets/activity_full.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trim_db"
path = "fuzz_targets/trim_db.rs"
test = false
doc = false
bench = false

[[bin]]
name = "db_parse"
path = "fuzz_targets/db_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_frame"
path = "fuzz_targets/ipc_frame.rs"
test = false
doc = false
bench = false

[workspace]
