[package]
name = "adsum-cli"
version = "0.38.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Alternative Discord RPC server CLI: game detection with bundled database, IPC/WebSocket transports and bridge"
license.workspace = true
readme = "../README.md"
repository.workspace = true
keywords = ["discord", "rich-presence", "rpc", "bridge", "cli"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "adsum"
path = "src/main.rs"

[dependencies]
adsum-core = { path = "../crates/adsum-core" }
adsum-detect = { path = "../crates/adsum-detect" }
clap = { version = "4.6.6", features = ["derive", "std", "env", "help", "usage", "error-context"], default-features = false }
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1.0"
sha2 = "0.11"
# Lowercase hex for update manifests and staged payloads. Present in the
# tree transitively; declared here because the CLI calls it directly.
hex = "0.4"
minisign-verify = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "std"] }
